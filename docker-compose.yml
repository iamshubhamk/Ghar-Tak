# Local development database (MongoDB). Run the API from backend/ with uvicorn as usual:
#   docker compose up -d
#   cd backend && uvicorn app.main:app --reload
services:
  mongo:
    image: mongo:7
    container_name: ghartak-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
