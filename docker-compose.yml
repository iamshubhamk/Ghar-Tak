services:
  postgres:
    image: postgres:16-alpine
    container_name: ghartak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ghartak
      POSTGRES_USER: ghartak
      POSTGRES_PASSWORD: ghartak
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghartak -d ghartak"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
